name: Android APK üret

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Bütçe Takip APK
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: JavaScript bağımlılıklarını kur
        run: npm install

      - name: Web uygulamasını derle
        run: npm run build

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Android bildirim izinlerini ekle
        run: node scripts/patch-android.mjs

      - name: Web dosyalarını Android projesine aktar
        run: npx cap sync android

      - name: Debug APK oluştur
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: butce-takip-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
